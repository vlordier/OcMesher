repos:
  - repo: local
    hooks:
      - id: file-length-policy
        name: file-length-policy
        entry: python tests/file_length_guard.py
        language: python
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: debug-statements

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: ["--py311-plus"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.7
    hooks:
      - id: clang-format
        types_or: [c, c++]

  - repo: https://github.com/pre-commit/mirrors-clang-tidy
    rev: v19.1.7
    hooks:
      - id: clang-tidy
        types_or: [c, c++]
        args:
          - "--extra-arg=-std=c++17"
          - "--extra-arg=-fopenmp"
          - "--warnings-as-errors=*"
          - "--header-filter=^ocmesher/source/.*"
