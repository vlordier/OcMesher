[package]
name = "ocmesher-core"
version = "0.1.0"
edition = "2021"
description = "Rust core: dynamic loader for OcMesher C++ backend + pyo3-based meshing pipeline"
build = "build.rs"

[features]
default = []
tch-kernels = ["dep:tch"]

[dependencies]
libloading = "0.8"
pyo3 = { version = "0.22", features = [] }
numpy = "0.22"
ndarray = "0.16"
thiserror = "2"
tch = { version = "0.18", optional = true }
