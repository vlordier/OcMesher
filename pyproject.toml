[project]
name = "ocmesher"
version = "1.0.0"
description = "View-Dependent Octree-based Mesh Extraction in Unbounded Scenes for Procedural Synthetic Data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "vnoise",
    "trimesh",
    "gin-config",
    "tqdm",
    "psutil",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
