[project]
name = "ocmesher"
version = "1.0.0"
description = "View-Dependent Octree-based Mesh Extraction in Unbounded Scenes for Procedural Synthetic Data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24.0",
    "vnoise>=0.1.0",
    "trimesh>=4.0.0",
    "gin-config>=0.5.0",
    "tqdm>=4.65.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0.0",
]
rust = [
    "maturin>=1.7.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.5",
    "pyupgrade>=3.15",
    "ruff>=0.15.6",
]
benchmark = [
    "setuptools<81",  # vnoise currently imports pkg_resources
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.29.0",
]

[project.urls]
Homepage = "https://github.com/princeton-vl/OcMesher"
Repository = "https://github.com/princeton-vl/OcMesher"
Issues = "https://github.com/princeton-vl/OcMesher/issues"
Documentation = "https://princeton-vl.github.io/OcMesher/"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ocmesher*"]

[tool.setuptools.package-data]
ocmesher = ["py.typed"]

# ---------------------------------------------------------------------------
# Ruff – tight lint & format configuration (ignoring E501 line-length)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # -- Line length (explicitly requested to ignore) -----------------------
    "E501",

    # -- Incompatible docstring rule pairs ----------------------------------
    "D203",   # conflicts with D211 (no-blank-line-before-class)
    "D213",   # conflicts with D212 (multi-line-summary-first-line)

    # -- Type-annotation rules (handled by pyrefly / ty instead) ------------
    "ANN",

    # -- Formatter-managed rules (ruff format handles trailing commas) ------
    "COM812",
]

[tool.ruff.lint.per-file-ignores]
# root __init__.py – intentional top-level package
"__init__.py" = [
    "INP001",   # implicit namespace package
    "N999",     # module name matches project, intentional
    "PLC0415",  # conditional/lazy imports in __init__.py
]
# core.py – complex scientific code with many C-bindings
"ocmesher/core.py" = [
    "FBT001",   # boolean-typed positional arg (__init__ bool kwargs are public API)
    "FBT002",   # boolean default positional args (API backwards-compat)
    "PLR0913",  # too-many-arguments (ctypes register_func calls)
    "PLR0915",  # too-many-statements (__call__ orchestrates meshing)
    "C901",     # complex methods (kernel_caller has split enclosed/non-enclosed loops)
    "PLR0912",  # too-many-branches (kernel_caller has 4 specialised batch paths)
    "TC001",    # typing-only first-party import (KernelSequence used in type hints)
    "RUF023",   # unsorted __slots__ (order matches __init__ signature)
    "S101",     # assert usage (internal validation invariants)
    "PT018",    # composite assertions (multi-condition validation)
]
# interface.py – ctypes helper with many function params
"ocmesher/utils/interface.py" = [
    "PLR0913",  # too-many-arguments (register_func has 6 params for ctypes binding)
]
# MLX mesher – complex scientific code with Apple Silicon GPU tensor ops
"ocmesher/mlx_core.py" = [
    "FBT001",   # boolean-typed positional arg (__init__ bool kwargs are public API)
    "FBT002",   # boolean default positional args (API backwards-compat)
    "PLR0913",  # too-many-arguments (constructor mirrors original API)
    "PLR0915",  # too-many-statements (complex meshing pipeline)
    "PLR0912",  # too-many-branches (refinement dispatch logic)
    "C901",     # complex functions (SDF evaluation)
    "D107",     # missing docstring in __init__ (simple timer class)
    "ARG002",   # unused method argument (kwargs forwarded to parent)
    "ERA001",   # commented-out code (legacy camera math annotation)
    "PLC0415",  # local imports avoid top-level import cost for optional MLX
    "TRY300",   # try/except for optional dependency detection
]
# timer utility – logs timing info
"ocmesher/utils/timer.py" = [
    "FBT001",   # boolean-typed positional arg (API backwards-compat)
    "FBT002",   # boolean default positional arg (API backwards-compat)
    "D107",     # missing docstring in __init__ (simple timer class)
]
# PyTorch mesher – complex scientific code with GPU tensor ops
"ocmesher/torch_core.py" = [
    "FBT001",   # boolean-typed positional arg (__init__ bool kwargs are public API)
    "FBT002",   # boolean default positional args (API backwards-compat)
    "TC001",    # typing-only first-party import (type hints)
    "PLR0913",  # too-many-arguments (constructor mirrors original API)
    "PLR0915",  # too-many-statements (complex meshing pipeline)
    "C901",     # complex functions (SDF evaluation)
    "D417",     # missing argument description (bisection_tol documented in parent)
]
"ocmesher/rust_backend.py" = [
    "FBT001",   # boolean-typed positional args (API mirrors OcMesher)
    "FBT002",   # boolean default positional args (API backwards-compat)
    "PLR0913",  # too-many-arguments (constructor mirrors original API)
    "PLC0415",  # local import in factory avoids top-level import cost
    "C901",     # complex functions (batched kernel building)
    "PLR0912",  # too-many-branches (dispatch logic)
    "PLR0915",  # too-many-statements (__call__ orchestrates meshing)
    "PLR2004",  # magic value comparison (batch size thresholds)
]
"ocmesher/factory.py" = [
    "PLC0415",  # lazy backend imports avoid importing optional deps at module import
]
# benchmark script – standalone runner
"benchmarks/run_benchmark.py" = [
    "SLF001",   # private member access (benchmarking internal methods)
    "PLR0915",  # too-many-statements (benchmark main)
    "PLC0415",  # conditional imports (benchmarks need try/except for optional backends)
    "C901",     # complex functions (benchmark main)
    "PLR0912",  # too-many-branches (benchmark main)
    "PLR0913",  # too-many-arguments (benchmark functions mirror mesher API)
]
# API parity benchmark (upstream comparison)
"benchmarks/bench_api_parity_upstream.py" = [
    "EXE001",   # shebang present but not executable (run via python -m)
    "D101",     # missing docstring in public class (benchmark helper)
    "D103",     # missing docstring in public function (benchmark helper)
    "TRY003",   # long exception message (benchmark error context)
    "EM102",    # f-string in exception (benchmark error context)
    "T201",     # print statements (benchmark output)
]
# Result utilities (benchmark helpers)
"benchmarks/result_utils.py" = [
    "FBT001",   # boolean-typed positional arg (API backwards-compat)
    "SIM108",   # if-else-block instead of ternary (readability)
]
# tests - allow assertions, magic values, no docstrings, etc.
"tests/**/*.py" = [
    "S101",     # assert usage expected in tests
    "D",        # no docstring enforcement in tests
    "PLR2004",  # magic values used intentionally in test assertions
    "SLF001",   # internal-method tests validate non-public fast paths
    "E402",     # module-level pytest.importorskip patterns in torch-only tests
    "PLC0415",  # test-local imports for importability checks
]

[tool.ruff.lint.isort]
known-first-party = ["ocmesher"]

[tool.ruff.lint.flake8-boolean-trap]
extend-allowed-calls = ["gin.configurable"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["gin.configurable"]
# Allow uppercase in domain-specific variable names (matrices, coordinates)
ignore-names = [
    "AsInt",
    "AsDouble",
    "AsFloat",
    "AsBool",
    "AC",
    "XYZ*",
    "Ks",
    "Hs",
    "Ws",
    "n_XYZ",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# Pyrefly – type-checking configuration
# ---------------------------------------------------------------------------
[tool.pyrefly]
project_includes = ["ocmesher", "demo.py"]
project_excludes = ["ocmesher/source"]
python_version = "3.11"
search_path = ["."]

[tool.pyrefly.errors]
# Attributes set dynamically via setattr in register_func (ctypes binding)
missing-attribute = false

# ---------------------------------------------------------------------------
# ty (Astral) – type-checking configuration
# ---------------------------------------------------------------------------
[tool.ty]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
# Dynamic attributes set via setattr in register_func are unresolvable
unresolved-attribute = "ignore"
# Third-party packages may not be resolvable without a venv; warn, don't fail
unresolved-import = "warn"
# Dynamic method calls on backend objects (hasattr pattern)
call-non-callable = "warn"
# Return type mismatches from numpy type inference
invalid-return-type = "warn"
# ctypes POINTER overloads - complex type inference
no-matching-overload = "warn"

# ---------------------------------------------------------------------------
# Pytest – test runner configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--ignore=tests/cpp",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring compiled C++ library",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["ocmesher"]
omit = ["tests/*", "ocmesher/torch_core.py"]

[tool.coverage.report]
show_missing = true
fail_under = 60

# ---------------------------------------------------------------------------
# Vulture – dead code detection
# ---------------------------------------------------------------------------
[tool.vulture]
paths = ["ocmesher", "demo.py"]
min_confidence = 80
