[project]
name = "ocmesher"
version = "1.0.0"
description = "View-Dependent Octree-based Mesh Extraction in Unbounded Scenes for Procedural Synthetic Data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24.0",
    "vnoise>=0.1.0",
    "trimesh>=4.0.0",
    "gin-config>=0.5.0",
    "tqdm>=4.65.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pyupgrade>=3.15",
    "ruff>=0.4.0",
]
benchmark = [
    "setuptools<81",  # vnoise currently imports pkg_resources
    "numba>=0.60.0",  # JIT-compiled SDF (Opt-numba tier)
    "mlx>=0.22.0",    # Apple Metal GPU SDF (Opt-metal tier, macOS-only)
]

[project.urls]
Homepage = "https://github.com/princeton-vl/OcMesher"
Repository = "https://github.com/princeton-vl/OcMesher"
Issues = "https://github.com/princeton-vl/OcMesher/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ocmesher*"]

[tool.setuptools.package-data]
ocmesher = ["py.typed"]

# ---------------------------------------------------------------------------
# Ruff – tight lint & format configuration (ignoring E501 line-length)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # -- Line length (explicitly requested to ignore) -----------------------
    "E501",

    # -- Incompatible docstring rule pairs ----------------------------------
    "D203",   # conflicts with D211 (no-blank-line-before-class)
    "D213",   # conflicts with D212 (multi-line-summary-first-line)

    # -- Type-annotation rules (handled by pyrefly / ty instead) ------------
    "ANN",

    # -- Formatter-managed rules (ruff format handles trailing commas) ------
    "COM812",
]

[tool.ruff.lint.per-file-ignores]
# demo.py – standalone script, not a package
"demo.py" = [
    "INP001",   # implicit namespace package
]
# root __init__.py – intentional top-level package
"__init__.py" = [
    "INP001",   # implicit namespace package
    "N999",     # module name matches project, intentional
    "D104",     # package-level __init__.py files (some are intentionally empty)
    "PLC0415",  # conditional/lazy imports in __init__.py
]
# core.py – complex scientific code with many C-bindings
"ocmesher/core.py" = [
    "FBT002",   # boolean default positional args (API backwards-compat)
    "PLR0913",  # too-many-arguments (ctypes register_func calls)
    "PLR0915",  # too-many-statements (__call__ orchestrates meshing)
    "C901",     # complex methods (kernel_caller has split enclosed/non-enclosed loops)
    "PLR0912",  # too-many-branches (kernel_caller has 4 specialised batch paths)
]
# interface.py – ctypes helper with many function params
"ocmesher/utils/interface.py" = [
    "PLR0913",  # too-many-arguments (register_func has 6 params for ctypes binding)
]
# timer utility – logs timing info
"ocmesher/utils/timer.py" = [
    "FBT001",   # boolean-typed positional arg (API backwards-compat)
    "FBT002",   # boolean default positional arg (API backwards-compat)
]
# PyTorch mesher – complex scientific code with GPU tensor ops
"ocmesher/torch_core.py" = [
    "FBT002",   # boolean default positional args (API backwards-compat)
]
# benchmark script – standalone runner
"benchmarks/run_benchmark.py" = [
    "INP001",   # implicit namespace package
    "SLF001",   # private member access (benchmarking internal methods)
    "S101",     # assert usage
    "PLR0915",  # too-many-statements (benchmark main)
    "PLC0415",  # conditional imports (benchmarks need try/except for optional backends)
    "C901",     # complex functions (benchmark main)
    "PLR0912",  # too-many-branches (benchmark main)
    "PLR0913",  # too-many-arguments (benchmark functions mirror mesher API)
]
# top-level benchmark runner
"benchmark.py" = [
    "INP001",   # implicit namespace package
    "T201",     # print statements (benchmark output)
    "S603",     # subprocess calls are intentional in benchmark harness
    "S607",     # partial executable path (uses system bash intentionally)
    "PLW1510",  # subprocess.run check handling is explicit
    "TRY003",   # benchmark exceptions keep contextual messages inline
    "EM101",    # same rationale as TRY003
    "EM102",    # same rationale as TRY003
    "PLW2901",  # loop variable reuse is local and readable here
    "D",        # no docstring enforcement in benchmark script
    "EXE001",   # shebang is informational; script may be launched via python
]
# Python overhead micro-benchmark
"benchmarks/bench_python_overhead.py" = [
    "INP001",   # implicit namespace package
    "SLF001",   # private member access (benchmarking internal methods)
    "T201",     # print statements (benchmark output)
    "B023",     # loop-variable binding in closures (intentional for timing)
    "D103",     # missing docstring in main()
    "PTH123",   # open() vs Path.open() (simple CLI)
]
# End-to-end benchmark (branch comparison)
"benchmarks/bench_e2e.py" = [
    "INP001",   # implicit namespace package
    "SLF001",   # private member access (benchmarking internal methods)
    "T201",     # print statements (benchmark output)
    "B023",     # loop-variable binding in closures (intentional for timing)
    "D103",     # missing docstring in main()
    "PTH123",   # open() vs Path.open() (simple CLI)
    "PLR2004",  # magic values OK in benchmarks
    "C901",     # complex functions OK in benchmark main/regression_check
    "PLR0912",  # too-many-branches in regression_check
    "PLR0915",  # too-many-statements in main
    "F841",     # unused variable `sdf` (intentional: benchmarking call overhead)
    "ARG001",   # unused function arguments (future-proofing API)
    "SIM102",   # nested if in regression checks (clearer error messages)
]
# benchmark __init__
"benchmarks/__init__.py" = [
    "INP001",   # implicit namespace package
    "D104",     # empty package init
]
# tests - allow assertions, magic values, no docstrings, etc.
"tests/**/*.py" = [
    "S101",     # assert usage expected in tests
    "D",        # no docstring enforcement in tests
    "PLR2004",  # magic values OK in test assertions
    "INP001",   # implicit namespace package
    "T201",     # print statements for debugging
    "PT019",    # @patch-injected args look like unused fixtures
    "SLF001",   # private member access expected in tests
    "RUF059",   # unused unpacked variables OK in tests
    "E402",     # module-level imports not at top (pytest.importorskip pattern)
    "PLC0415",  # test-local imports for importability checks
    "N811",     # constant imported as non-constant alias in assertions
    "ERA001",   # section divider comments look like commented-out code
]

[tool.ruff.lint.isort]
known-first-party = ["ocmesher"]

[tool.ruff.lint.flake8-boolean-trap]
extend-allowed-calls = ["gin.configurable"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["gin.configurable"]
# Allow uppercase in domain-specific variable names (matrices, coordinates)
ignore-names = [
    "AsInt",
    "AsDouble",
    "AsFloat",
    "AsBool",
    "AC",
    "XYZ*",
    "Ks",
    "Hs",
    "Ws",
    "n_XYZ",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# Pyrefly – type-checking configuration
# ---------------------------------------------------------------------------
[tool.pyrefly]
project_includes = ["ocmesher", "demo.py"]
project_excludes = ["ocmesher/source"]
python_version = "3.11"
search_path = ["."]

[tool.pyrefly.errors]
# Attributes set dynamically via setattr in register_func (ctypes binding)
missing-attribute = false

# ---------------------------------------------------------------------------
# ty (Astral) – type-checking configuration
# ---------------------------------------------------------------------------
[tool.ty]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
# Dynamic attributes set via setattr in register_func are unresolvable
unresolved-attribute = "ignore"
# Third-party packages may not be resolvable without a venv; warn, don't fail
unresolved-import = "warn"

# ---------------------------------------------------------------------------
# Pytest – test runner configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--ignore=tests/cpp",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring compiled C++ library",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["ocmesher"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 60

# ---------------------------------------------------------------------------
# Vulture – dead code detection
# ---------------------------------------------------------------------------
[tool.vulture]
paths = ["ocmesher", "demo.py"]
min_confidence = 80
