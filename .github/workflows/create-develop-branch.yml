name: Create develop branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-develop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create develop branch if it does not exist
        run: |
          if git ls-remote --exit-code origin develop; then
            echo "develop branch already exists"
          else
            echo "Creating develop branch from main"
            git checkout -b develop
            git push origin develop
          fi
