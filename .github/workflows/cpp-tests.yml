name: C++ Tests

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE/**"
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libomp-dev

      - name: Build shared library
        run: bash install.sh

      - name: Build and run C++ tests
        run: |
          failed=0
          for src in tests/cpp/test_*.cpp; do
            name=$(basename "$src" .cpp)
            echo "::group::Building $name"
            g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror -fopenmp -o "tests/cpp/$name" "$src" -lm
            echo "::endgroup::"
            echo "::group::Running $name"
            if ! "./tests/cpp/$name"; then
              failed=1
            fi
            echo "::endgroup::"
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::Some test suites failed"
            exit 1
          fi

