name: Lint

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "**.py"
      - ".python-version"
      - "pyproject.toml"
      - "pyrightconfig.json"
      - "Makefile"
      - ".pre-commit-config.yaml"
      - "uv.lock"
      - ".github/workflows/lint.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "**.py"
      - ".python-version"
      - "pyproject.toml"
      - "pyrightconfig.json"
      - "Makefile"
      - ".pre-commit-config.yaml"
      - "uv.lock"
      - ".github/workflows/lint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    name: ruff (lint + format check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@b693db276a2b4e79b781a0f97477dfc3bb4e52f3

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Run ruff lint
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run file-length policy guard
        run: uv run python tests/file_length_guard.py

  ty:
    name: ty (static type check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@b693db276a2b4e79b781a0f97477dfc3bb4e52f3

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Run ty
        run: uv run ty check ocmesher/
