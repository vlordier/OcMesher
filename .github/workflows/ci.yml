name: CI

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE/**"
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@b693db276a2b4e79b781a0f97477dfc3bb4e52f3

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libomp-dev

      - name: Build shared library
        run: bash install.sh

      - name: Build and run C++ tests
        run: |
          failed=0
          for src in tests/cpp/test_*.cpp; do
            [ -e "$src" ] || continue
            name=$(basename "$src" .cpp)
            echo "::group::Building $name"
            g++ -std=c++11 -O2 -o "tests/cpp/$name" "$src" -lm
            echo "::endgroup::"
            echo "::group::Running $name"
            if ! "./tests/cpp/$name"; then
              failed=1
            fi
            echo "::endgroup::"
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::Some test suites failed"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Run file-length policy guard
        run: uv run python tests/file_length_guard.py

      - name: Run Python tests
        run: |
          if [ -d tests ]; then
            uv run python -m pytest tests/ -v --ignore=tests/cpp -n auto
          else
            echo "No Python tests directory found, skipping."
          fi
