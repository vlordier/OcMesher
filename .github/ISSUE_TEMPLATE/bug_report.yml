name: Bug Report
description: Report a bug in OcMesher
labels: ["bug"]
body:
  - type: markdown
    attributes:
      text: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug here
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the bug.
      placeholder: |
        1. Go to '...'
        2. Run '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      description: Which backend(s) are affected?
      options:
        - cpp (default)
        - torch
        - rust
        - mlx
        - all
        - unknown
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: OS / Platform
      description: "e.g. macOS 14.2, Ubuntu 22.04, Python 3.11"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
    validations:
      required: false
