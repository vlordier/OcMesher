name: Feature Request
description: Suggest a new feature or enhancement for OcMesher
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      text: |
        Thanks for suggesting a feature! Please describe what you'd like to see improved.
  - type: textarea
    id: summary
    attributes:
      label: Feature summary
      description: A clear and concise summary of the feature.
      placeholder: Briefly describe the feature
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: |
        Describe the use case or problem that this feature would solve.
        Why is this feature important for OcMesher users?
    validations:
      required: true
  - type: textarea
    id: propose
    attributes:
      label: Proposed solution
      description: Describe the solution you'd like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions you've considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context or mockups about the feature.
    validations:
      required: false
